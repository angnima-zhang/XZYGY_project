<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>先挣一个亿 - UI原型 v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 手机模拟器 */
        .phone {
            width: 375px;
            height: 812px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            border-radius: 40px;
            padding: 44px 20px 34px;
            position: relative;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        
        /* 刘海 */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
        }
        
        /* 游戏容器 */
        .game-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* ========== 顶部区域 ========== */
        .top-section {
            text-align: center;
            padding: 10px 0;
        }
        
        .balance-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .balance {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(180deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            letter-spacing: -1px;
        }
        
        .balance::before {
            content: '¥';
            font-size: 28px;
            margin-right: 4px;
        }
        
        .target-section {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .target-text {
            color: #aaa;
            font-size: 13px;
        }
        
        .target-value {
            color: #FFD700;
            font-weight: 600;
            font-size: 14px;
        }
        
        /* 进度条 */
        .progress-container {
            margin-top: 10px;
            padding: 0 20px;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            width: 65.3%;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .progress-text {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 6px;
        }
        
        /* 点击次数 */
        .click-count {
            margin-top: 8px;
            color: #666;
            font-size: 12px;
        }
        
        /* ========== 中部硬币区域 ========== */
        .coin-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        
        .coin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 280px;
        }
        
        .coin {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #8B4513;
            cursor: pointer;
            box-shadow: 
                0 4px 15px rgba(255, 215, 0, 0.4),
                inset 0 -3px 10px rgba(0,0,0,0.2),
                inset 0 3px 10px rgba(255,255,255,0.3);
            transition: transform 0.1s;
            position: relative;
        }
        
        .coin:active {
            transform: scale(0.95);
        }
        
        .coin::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 25%;
            height: 15%;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
        }
        
        .coin-value {
            position: absolute;
            bottom: -20px;
            font-size: 11px;
            color: #FFD700;
            font-weight: 600;
        }
        
        /* ========== 购买区域 ========== */
        .purchase-section {
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            margin: 0 0 10px;
        }
        
        .purchase-title {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .purchase-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .purchase-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
        }
        
        .purchase-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .purchase-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .purchase-icon.upgrade {
            background: linear-gradient(145deg, #FFD700, #FFA500);
        }
        
        .purchase-icon.coin-add {
            background: linear-gradient(145deg, #C0C0C0, #808080);
        }
        
        .purchase-icon.speed {
            background: linear-gradient(145deg, #FF6B6B, #EE5A5A);
        }
        
        .purchase-text {
            flex: 1;
        }
        
        .purchase-name {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }
        
        .purchase-desc {
            color: #888;
            font-size: 11px;
            margin-top: 2px;
        }
        
        .purchase-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-pay {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #8B4513;
        }
        
        .btn-ad {
            background: linear-gradient(145deg, #4A90D9, #357ABD);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .btn-ad::before {
            content: '▶';
            font-size: 10px;
        }
        
        .btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* ========== 底部功能区 ========== */
        .bottom-section {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 8px 16px;
            transition: color 0.2s;
        }
        
        .nav-btn:hover {
            color: #FFD700;
        }
        
        .nav-icon {
            font-size: 24px;
        }
        
        .nav-text {
            font-size: 11px;
        }
        
        /* ========== 弹窗 ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2e 100%);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            color: #FFD700;
            font-size: 20px;
            font-weight: 700;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        
        /* 排行榜样式 */
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        .rank-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        
        .rank-number.gold {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #8B4513;
        }
        
        .rank-number.silver {
            background: linear-gradient(145deg, #C0C0C0, #808080);
            color: #333;
        }
        
        .rank-number.bronze {
            background: linear-gradient(145deg, #CD7F32, #A0522D);
            color: #fff;
        }
        
        .rank-info {
            flex: 1;
        }
        
        .rank-name {
            color: #fff;
            font-size: 14px;
        }
        
        .rank-clicks {
            color: #888;
            font-size: 12px;
        }
        
        /* 设置样式 */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .setting-label {
            color: #fff;
            font-size: 14px;
        }
        
        /* 切换开关 */
        .toggle {
            width: 50px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle.active {
            background: #4CAF50;
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        
        .toggle.active::after {
            transform: translateX(22px);
        }
        
        /* 飘字动画 */
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }
        
        .float-text {
            position: absolute;
            color: #FFD700;
            font-size: 20px;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }
        
        /* 响应式 */
        @media (max-width: 400px) {
            .phone {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="notch"></div>
        
        <div class="game-container">
            <!-- 顶部区域 -->
            <div class="top-section">
                <div class="balance-label">当前余额</div>
                <div class="balance" id="balance">65,342,891</div>
                
                <div class="target-section">
                    <span class="target-text">目标</span>
                    <span class="target-value">¥100,000,000</span>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress"></div>
                    </div>
                    <div class="progress-text">已完成 65.3% · 还需 ¥34,657,109</div>
                </div>
                
                <div class="click-count">今日点击: 1,234 次</div>
            </div>
            
            <!-- 中部硬币区域 -->
            <div class="coin-section">
                <div class="coin-grid">
                    <div class="coin" onclick="flipCoin(this, 5)">
                        5
                        <span class="coin-value">¥5</span>
                    </div>
                    <div class="coin" onclick="flipCoin(this, 5)">
                        5
                        <span class="coin-value">¥5</span>
                    </div>
                    <div class="coin" onclick="flipCoin(this, 5)">
                        5
                        <span class="coin-value">¥5</span>
                    </div>
                    <div class="coin" onclick="flipCoin(this, 5)">
                        5
                        <span class="coin-value">¥5</span>
                    </div>
                    <div class="coin" onclick="flipCoin(this, 5)">
                        5
                        <span class="coin-value">¥5</span>
                    </div>
                </div>
            </div>
            
            <!-- 购买区域 -->
            <div class="purchase-section">
                <div class="purchase-title">快速升级</div>
                <div class="purchase-grid">
                    <div class="purchase-item">
                        <div class="purchase-info">
                            <div class="purchase-icon upgrade">⬆</div>
                            <div class="purchase-text">
                                <div class="purchase-name">面值升级</div>
                                <div class="purchase-desc">所有硬币+1</div>
                            </div>
                        </div>
                        <div class="purchase-buttons">
                            <button class="btn btn-pay">¥3</button>
                            <button class="btn btn-ad">免费</button>
                        </div>
                    </div>
                    
                    <div class="purchase-item">
                        <div class="purchase-info">
                            <div class="purchase-icon coin-add">🪙</div>
                            <div class="purchase-text">
                                <div class="purchase-name">购买硬币</div>
                                <div class="purchase-desc">已达上限 5/5</div>
                            </div>
                        </div>
                        <div class="purchase-buttons">
                            <button class="btn btn-pay" disabled>¥25</button>
                            <button class="btn btn-ad" disabled>已满</button>
                        </div>
                    </div>
                    
                    <div class="purchase-item">
                        <div class="purchase-info">
                            <div class="purchase-icon speed">⚡</div>
                            <div class="purchase-text">
                                <div class="purchase-name">加速翻转</div>
                                <div class="purchase-desc">速度+10% (当前+30%)</div>
                            </div>
                        </div>
                        <div class="purchase-buttons">
                            <button class="btn btn-pay">¥4</button>
                            <button class="btn btn-ad">免费</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 底部功能区 -->
            <div class="bottom-section">
                <button class="nav-btn" onclick="openModal('shop')">
                    <span class="nav-icon">🏪</span>
                    <span class="nav-text">商店</span>
                </button>
                <button class="nav-btn" onclick="openModal('rank')">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-text">排行</span>
                </button>
                <button class="nav-btn" onclick="openModal('settings')">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">设置</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 排行榜弹窗 -->
    <div class="modal" id="rank-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🏆 今日排行榜</h2>
                <button class="modal-close" onclick="closeModal('rank')">×</button>
            </div>
            <div class="rank-list">
                <div class="rank-item">
                    <div class="rank-number gold">1</div>
                    <div class="rank-info">
                        <div class="rank-name">玩家小明</div>
                        <div class="rank-clicks">856 次点击</div>
                    </div>
                </div>
                <div class="rank-item">
                    <div class="rank-number silver">2</div>
                    <div class="rank-info">
                        <div class="rank-name">玩家小红</div>
                        <div class="rank-clicks">923 次点击</div>
                    </div>
                </div>
                <div class="rank-item">
                    <div class="rank-number bronze">3</div>
                    <div class="rank-info">
                        <div class="rank-name">玩家小李</div>
                        <div class="rank-clicks">1,034 次点击</div>
                    </div>
                </div>
                <div class="rank-item">
                    <div class="rank-number" style="background: #444; color: #fff;">4</div>
                    <div class="rank-info">
                        <div class="rank-name">玩家小张</div>
                        <div class="rank-clicks">1,156 次点击</div>
                    </div>
                </div>
                <div class="rank-item" style="background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3);">
                    <div class="rank-number" style="background: #666; color: #fff;">28</div>
                    <div class="rank-info">
                        <div class="rank-name">我 (当前)</div>
                        <div class="rank-clicks">1,234 次点击</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 设置弹窗 -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">⚙️ 设置</h2>
                <button class="modal-close" onclick="closeModal('settings')">×</button>
            </div>
            <div class="settings-list">
                <div class="setting-item">
                    <span class="setting-label">🔊 音效</span>
                    <div class="toggle active" onclick="this.classList.toggle('active')"></div>
                </div>
                <div class="setting-item">
                    <span class="setting-label">🎵 音乐</span>
                    <div class="toggle active" onclick="this.classList.toggle('active')"></div>
                </div>
                <div class="setting-item">
                    <span class="setting-label">📳 震动</span>
                    <div class="toggle" onclick="this.classList.toggle('active')"></div>
                </div>
                <div class="setting-item">
                    <span class="setting-label">❓ 游戏说明</span>
                    <button class="btn btn-pay" style="padding: 6px 12px;">查看</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let balance = 65342891;
        const target = 100000000;
        
        function flipCoin(element, value) {
            // 翻转动画
            element.style.transform = 'rotateY(720deg)';
            setTimeout(() => {
                element.style.transform = 'rotateY(0deg)';
            }, 600);
            
            // 随机决定是否正面（50%概率）
            if (Math.random() > 0.5) {
                // 正面 - 获得金币
                balance += value;
                updateBalance();
                showFloatText(element, `+${value}`);
            } else {
                // 背面
                showFloatText(element, '×');
            }
        }
        
        function updateBalance() {
            document.getElementById('balance').textContent = balance.toLocaleString();
            const progress = (balance / target * 100).toFixed(1);
            document.getElementById('progress').style.width = progress + '%';
        }
        
        function showFloatText(element, text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';
            floatEl.textContent = text;
            
            const rect = element.getBoundingClientRect();
            floatEl.style.left = rect.left + rect.width/2 - 20 + 'px';
            floatEl.style.top = rect.top + 'px';
            
            document.body.appendChild(floatEl);
            
            setTimeout(() => {
                floatEl.remove();
            }, 1000);
        }
        
        function openModal(type) {
            document.getElementById(type + '-modal').classList.add('active');
        }
        
        function closeModal(type) {
            document.getElementById(type + '-modal').classList.remove('active');
        }
        
        // 点击模态框外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
